<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>音楽目覚まし</title>

<style>

body{
    font-family:sans-serif;
    text-align:center;
    background:#eef2ff;
    padding-top:50px;
}

.box{
    background:white;
    width:320px;
    margin:auto;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

input,button{
    margin:10px;
    padding:10px;
    font-size:16px;
}

button{
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#setBtn{
    background:#4CAF50;
    color:white;
}

#stopBtn{
    background:#ff4d4d;
    color:white;
}

</style>
</head>

<body>

<div class="box">

<h1>⏰ 目覚まし</h1>

<input type="time" id="alarmTime">

<br>

<button id="setBtn">セット</button>

<button id="stopBtn">停止</button>

<p id="status">未セット</p>

</div>

<audio id="alarmAudio" src="videoplayback.mp4"></audio>

<script>

const alarmTimeInput =
document.getElementById("alarmTime");

const setBtn =
document.getElementById("setBtn");

const stopBtn =
document.getElementById("stopBtn");

const status =
document.getElementById("status");

const audio =
document.getElementById("alarmAudio");

let alarmTime = null;
let isSet = false;

setBtn.addEventListener("click",()=>{

    alarmTime = alarmTimeInput.value;

    if(!alarmTime){
        alert("時間を設定してください");
        return;
    }

    isSet = true;

    status.textContent =
    `⏰ ${alarmTime} にセットしました`;

});

stopBtn.addEventListener("click",()=>{

    audio.pause();
    audio.currentTime = 0;

});

setInterval(()=>{

    if(!isSet) return;

    const now = new Date();

    const h =
    String(now.getHours()).padStart(2,"0");

    const m =
    String(now.getMinutes()).padStart(2,"0");

    const current = `${h}:${m}`;

    if(current === alarmTime){

        audio.play();

        status.textContent =
        "🚨 起床時間です！";

        isSet = false;

    }

},1000);

</script>

</body>
</html>
