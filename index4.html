<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自動目覚まし</title>

<style>
body{
    margin:0;
    height:100vh;
    font-family:sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.card{
    width:340px;
    padding:30px;
    border-radius:30px;
    background:rgba(255,255,255,0.12);
    box-shadow:0 0 30px rgba(0,0,0,0.4);
}

.time{
    font-size:56px;
    font-weight:bold;
    margin:20px 0;
}

.status{
    font-size:18px;
    font-weight:bold;
    margin-top:20px;
}

button{
    margin-top:25px;
    padding:14px 30px;
    font-size:18px;
    border:none;
    border-radius:999px;
    background:#ef4444;
    color:white;
}
</style>
</head>

<body>

<div class="card">
    <h1>⏰ 目覚まし</h1>

    <p>アラーム設定時刻</p>
    <div class="time" id="alarmTimeDisplay">--:--</div>

    <p id="status" class="status">起動中...</p>

    <button onclick="playAlarm()">再生 / 停止</button>
</div>

<audio id="alarmAudio" src="videoplayback.mp3" preload="auto" loop></audio>

<script>
const audio = document.getElementById("alarmAudio");
const alarmTimeDisplay = document.getElementById("alarmTimeDisplay");
const statusText = document.getElementById("status");

let alarmTime = null;
let alarmStarted = false;

function getCurrentTime(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,"0");
    const m = String(now.getMinutes()).padStart(2,"0");
    return `${h}:${m}`;
}

function playAlarm(){
    if(audio.paused){
        audio.currentTime = 0;
        audio.play();
        statusText.textContent = "🚨 アラーム発動中！";
    }else{
        audio.pause();
        audio.currentTime = 0;
        statusText.textContent = "停止しました";
    }
}

function startAlarm(){
    if(alarmStarted) return;

    const currentTime = getCurrentTime();

    if(currentTime === alarmTime){
        alarmStarted = true;

        audio.play()
        .then(()=>{
            statusText.textContent = "🚨 アラーム発動中！";
        })
        .catch(()=>{
            statusText.textContent = "⚠️ 自動再生が止められました。ボタンを押してください。";
        });
    }
}

window.onload = ()=>{
    alarmTime = getCurrentTime();

    alarmTimeDisplay.textContent = alarmTime;
    statusText.textContent = `${alarmTime} に自動セットしました`;

    startAlarm();
};
</script>

</body>
</html>
