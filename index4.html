<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>目覚まし</title>

<style>

body{
    margin:0;
    height:100vh;
    font-family:sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.card{
    width:340px;
    padding:30px;
    border-radius:30px;
    background:rgba(255,255,255,0.12);
    box-shadow:0 0 30px rgba(0,0,0,0.4);
}

input{
    font-size:36px;
    text-align:center;
    padding:10px;
    border-radius:15px;
    border:none;
    margin:15px 0;
}

.status{
    font-size:18px;
    font-weight:bold;
    margin-top:20px;
}

button{
    margin-top:20px;
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:999px;
    background:#ef4444;
    color:white;
}

</style>
</head>

<body>

<div class="card">

    <h1>⏰ 目覚まし</h1>

    <p>アラーム設定時刻</p>

    <input type="time" id="alarmTime">

    <p id="status" class="status">
    起動中...
    </p>

    <button onclick="stopAlarm()">
    停止
    </button>

</div>

<audio
id="alarmAudio"
src="videoplayback.mp3"
preload="auto"
loop>
</audio>

<script>

const alarmInput =
document.getElementById("alarmTime");

const statusText =
document.getElementById("status");

const audio =
document.getElementById("alarmAudio");

let alarmTime = "";

let isSet = false;

function getCurrentTime(){

    const now = new Date();

    const h =
    String(now.getHours())
    .padStart(2,"0");

    const m =
    String(now.getMinutes())
    .padStart(2,"0");

    return `${h}:${m}`;
}

function stopAlarm(){

    audio.pause();

    audio.currentTime = 0;

    statusText.textContent =
    "停止しました";
}

window.onload = ()=>{

    alarmTime = getCurrentTime();

    alarmInput.value = alarmTime;

    isSet = true;

    statusText.textContent =
    `${alarmTime} に自動セットしました`;

};

setInterval(()=>{

    if(!isSet) return;

    const current =
    getCurrentTime();

    if(current === alarmTime){

        audio.play()
        .then(()=>{

            statusText.textContent =
            "🚨 アラーム発動中！";

        })

        .catch(()=>{

            statusText.textContent =
            "⚠️ Safariの制限で自動再生できません";

        });

        isSet = false;

    }

},1000);

</script>

</body>
</html>
