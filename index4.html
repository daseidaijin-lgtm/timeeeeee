<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>自動再生</title>

<style>

body{
    background:black;
    color:white;
    font-family:sans-serif;
    text-align:center;
    padding-top:100px;
}

button{
    font-size:20px;
    padding:15px 30px;
    border:none;
    border-radius:10px;
    background:#4CAF50;
    color:white;
}

</style>
</head>

<body>

<h1>🎵 音楽再生ページ</h1>

<p>
iPad/Safariでは自動再生制限があるため、
最初にボタンを押してください。
</p>

<button onclick="playMusic()">
再生
</button>

<audio id="music" autoplay>
    <source src="videoplayback.mp3" type="audio/mpeg">
</audio>

<script>

const music =
document.getElementById("music");

function playMusic(){

    music.play();

}

window.onload = ()=>{

    music.play().catch(()=>{

        console.log(
        "自動再生がブロックされました"
        );

    });

};

</script>

</body>
</html>
